name: Research history migration checks

on:
  pull_request:
    paths:
      - 'docs/history/**'
      - 'README.md'
      - 'AGENTS.md'
      - 'verification/history_migration/**'
      - 'verification/**/run_checks.py'
      - '.github/workflows/history-migration.yml'

permissions:
  contents: read

jobs:
  identities:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          fetch-depth: 0
          persist-credentials: false
      - name: Check moved records and historical release identities
        env:
          PYTHONDONTWRITEBYTECODE: '1'
        run: |
          if [ -f verification/history_reduction/acceptance.py ]; then
            python3 verification/history_reduction/acceptance.py --history --verify-retained
          elif [ -f verification/sequential_consistency/acceptance.py ]; then
            python3 verification/sequential_consistency/acceptance.py --history --verify-retained
          else
            python3 verification/history_migration/checks.py
            python3 -O verification/history_migration/checks.py
          fi
