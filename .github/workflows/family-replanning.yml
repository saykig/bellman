name: family-replanning

on:
  pull_request:
    paths:
      - "verification/family_replanning/**"
      - "verification/persistent_model_families/**"
      - "foundations/BELLMAN_FAMILY_REPLANNING_AND_ROOT_GUARANTEES.md"
      - "foundations/BELLMAN_PERSISTENT_MODEL_FAMILY_CERTIFICATES.md"
  push:
    branches:
      - codex/family-aware-replanning

permissions:
  contents: read

jobs:
  exact-checks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Run maintained multistream acceptance and pinned historical replay
        env:
          PYTHONDONTWRITEBYTECODE: "1"
        run: python3 verification/multistream_collection/run_checks.py
