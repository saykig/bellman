name: two-stage-longitudinal-causal-policy

on:
  pull_request:
    paths:
      - "verification/longitudinal_causal_policy/**"
      - "foundations/BELLMAN_TWO_STAGE_LONGITUDINAL_CAUSAL_POLICY_AND_SEQUENTIAL_BRIDGE.md"
      - "verification/finite_causal_identification/**"
      - "foundations/BELLMAN_FINITE_CAUSAL_IDENTIFICATION_AND_DECISION_CERTIFICATION.md"
      - "verification/sequential_certificates/**"
      - "foundations/BELLMAN_SEQUENTIAL_CERTIFICATE_COMPOSITION.md"
      - ".github/workflows/two-stage-longitudinal-causal-policy.yml"
      - ".github/workflows/finite-causal-identification.yml"
      - "README.md"
      - "docs/programme/**"
      - "docs/history/records/FINDINGS_LEDGER.md"
      - "docs/history/records/SUBSTRATE_LEDGER.md"
  push:
    branches:
      - codex/two-stage-longitudinal-causal-policy

permissions:
  contents: read

jobs:
  exact-checks:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Run current longitudinal causal and pinned historical acceptance
        env:
          PYTHONDONTWRITEBYTECODE: "1"
        run: python3 verification/longitudinal_causal_policy/run_checks.py
