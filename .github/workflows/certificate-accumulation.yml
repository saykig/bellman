name: Certificate accumulation checks
on:
  pull_request:
    paths:
      - 'verification/certificate_accumulation/**'
      - 'foundations/BELLMAN_CERTIFICATE_ACCUMULATION_AND_POLICY_SELECTION.md'
      - '.github/workflows/certificate-accumulation.yml'
permissions:
  contents: read
jobs:
  exact-checks:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          fetch-depth: 0
          persist-credentials: false
      - name: Exact accumulation and preservation
        env:
          PYTHONDONTWRITEBYTECODE: '1'
        run: python3 verification/certificate_accumulation/run_checks.py
