name: longitudinal-causal-kernel-fibres

on:
  pull_request:
    paths:
      - 'verification/combined_acceptance/**'
      - "verification/longitudinal_causal_kernel_fibres/**"
      - "foundations/BELLMAN_LONGITUDINAL_CAUSAL_KERNEL_FIBRES_AND_PERSISTENT_DECISIONS.md"
      - "verification/longitudinal_causal_policy/**"
      - "foundations/BELLMAN_TWO_STAGE_LONGITUDINAL_CAUSAL_POLICY_AND_SEQUENTIAL_BRIDGE.md"
      - "verification/persistent_model_families/**"
      - "foundations/BELLMAN_PERSISTENT_MODEL_FAMILY_CERTIFICATES.md"
      - "verification/sequential_certificates/**"
      - "foundations/BELLMAN_SEQUENTIAL_CERTIFICATE_COMPOSITION.md"
      - ".github/workflows/longitudinal-causal-kernel-fibres.yml"
      - ".github/workflows/two-stage-longitudinal-causal-policy.yml"
      - "README.md"
      - "docs/programme/**"
      - "docs/history/records/FINDINGS_LEDGER.md"
      - "docs/history/records/SUBSTRATE_LEDGER.md"
  push:
    branches:
      - codex/longitudinal-causal-kernel-fiber

permissions:
  contents: read

jobs:
  exact-checks:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Run current kernel-fibre and pinned historical acceptance
        env:
          PYTHONDONTWRITEBYTECODE: "1"
        run: python3 verification/empirical_acceptance/acceptance.py --causal --verify-retained
