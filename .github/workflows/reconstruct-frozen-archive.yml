name: Reconstruct frozen archive

on:
  push:
    branches:
      - archive/kl4-kl5-findings-ledger
    paths:
      - .github/workflows/reconstruct-frozen-archive.yml

permissions:
  contents: write

jobs:
  reconstruct:
    runs-on: ubuntu-latest
    steps:
      - name: Check out archive branch
        uses: actions/checkout@v4
        with:
          ref: archive/kl4-kl5-findings-ledger
          fetch-depth: 0

      - name: Reconstruct and verify frozen artifacts
        shell: bash
        run: |
          set -euo pipefail

          mkdir -p experiments/kl4 experiments/kl5

          decode() {
            local src="$1"
            local dst="$2"
            base64 --decode "$src" | gzip --decompress --stdout > "$dst"
          }

          decode .archive-payload/kl4_packet.gz.b64 experiments/kl4/RUN_THIS_NEXT_KAHNEMAN_LAB_4_PARALLEL.md
          decode .archive-payload/kl4A.gz.b64 experiments/kl4/kahneman_lab_4A_information_vs_decision_value.md
          decode .archive-payload/kl4B.gz.b64 experiments/kl4/kahneman_lab_4B_deep_uncertainty_stability.md
          decode .archive-payload/kl4C.gz.b64 experiments/kl4/kahneman_lab_4C_query_sufficiency_quotients.md
          decode .archive-payload/kl4D.gz.b64 experiments/kl4/kahneman_lab_4D_stop_or_observe.md

          cat .archive-payload/kl4S.part00 .archive-payload/kl4S.part01 \
            | base64 --decode \
            | gzip --decompress --stdout \
            > experiments/kl4/kahneman_lab_4S_parallel_synthesis.md

          cat .archive-payload/kl5.part00 .archive-payload/kl5.part01 \
              .archive-payload/kl5.part02 .archive-payload/kl5.part03 \
            | base64 --decode \
            | gzip --decompress --stdout \
            > experiments/kl5/RUN_THIS_NEXT_KAHNEMAN_LAB_5_SEQUENTIAL_SUFFICIENCY.md

          cat > /tmp/kahneman-lab-checksums <<'EOF'
          d8206786bd7d07f3f92c4568ae4cc3f7c088aca8089a5a6d75f2f0b7bb4238ad  experiments/kl4/RUN_THIS_NEXT_KAHNEMAN_LAB_4_PARALLEL.md
          db484f36e4db782c28e7348f3d5d9da36fc6c7d6838d9aed27c1a06e187fa9b9  experiments/kl4/kahneman_lab_4A_information_vs_decision_value.md
          702f2f8fca10c53323d4f4a3a07798d29dc5176be99ce3feebe1500e70d219fb  experiments/kl4/kahneman_lab_4B_deep_uncertainty_stability.md
          3312c6499d7e2f50325d32537d7961ed46466b95e753c02189763b513450c7f3  experiments/kl4/kahneman_lab_4C_query_sufficiency_quotients.md
          a3494b711d99aa9997bf27bdd035ea67990321fe7e883fda35cfdae48b303c94  experiments/kl4/kahneman_lab_4D_stop_or_observe.md
          f4acd1da28f116764d1a8c5d4a00833691c4ed0f1196b3f1df142ae2b53e3acb  experiments/kl4/kahneman_lab_4S_parallel_synthesis.md
          43bf13e830d72fac72a36f18197b68d3e9465c8692ff9e69370512f88d7636d1  experiments/kl5/RUN_THIS_NEXT_KAHNEMAN_LAB_5_SEQUENTIAL_SUFFICIENCY.md
          EOF

          sha256sum --check /tmp/kahneman-lab-checksums

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add experiments/kl4 experiments/kl5
          git rm -r .archive-payload
          git commit -m "archive: add frozen KL4 and KL5 artifacts"
          git push origin HEAD:archive/kl4-kl5-findings-ledger
