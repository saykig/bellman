name: Combined mathematical and empirical acceptance
on:
  workflow_dispatch:
  pull_request:
    paths:
      - 'research/**'
      - 'verification/**'
      - 'foundations/**'
      - 'reviews/**'
      - 'docs/**'
      - 'README.md'
      - '.github/workflows/**'
  push:
    branches: ['codex/sequential-credibility', 'main']
    paths:
      - 'research/**'
      - 'verification/**'
      - 'foundations/**'
      - 'reviews/**'
      - 'docs/**'
      - 'README.md'
      - '.github/workflows/**'
permissions:
  contents: read
jobs:
  combined:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install -r research/empirical_trust_2016/requirements.txt
      - name: Explicitly acquire the hash-bound AFY author edition
        run: python research/beliefs_2024/reproduce.py acquire "$RUNNER_TEMP/Aoyagi_2024a_data.txt"
      - run: python verification/measurement_acceptance/acceptance.py --source "$RUNNER_TEMP/Aoyagi_2024a_data.txt" --recompute --verify-retained
        env:
          PYTHONDONTWRITEBYTECODE: '1'
