name: Combined strategic and causal acceptance
on:
  workflow_dispatch:
  pull_request:
    paths:
      - 'verification/**'
      - 'foundations/**'
      - 'reviews/**'
      - 'docs/**'
      - 'README.md'
      - '.github/workflows/**'
  push:
    branches: ['codex/sequential-credibility', 'main']
    paths:
      - 'verification/**'
      - 'foundations/**'
      - 'reviews/**'
      - 'docs/**'
      - 'README.md'
      - '.github/workflows/**'
permissions:
  contents: read
jobs:
  combined:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install -r verification/sequential_consistency/requirements.txt
      - run: python verification/combined_acceptance/acceptance.py --verify-retained
        env:
          PYTHONDONTWRITEBYTECODE: '1'
