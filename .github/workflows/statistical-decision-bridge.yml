name: statistical-decision-bridge

on:
  pull_request:
  push:
    branches:
      - codex/statistical-decision-bridge
      - codex/multistream-collection

permissions:
  contents: read

jobs:
  exact-checks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Run current multistream, scalar, and pinned preservation checks
        env:
          PYTHONDONTWRITEBYTECODE: "1"
        run: python3 verification/multistream_collection/run_checks.py
