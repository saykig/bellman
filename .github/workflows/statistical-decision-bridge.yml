name: statistical-decision-bridge

on:
  pull_request:
    paths:
      - "verification/statistical_decision_bridge/**"
      - "verification/multistream_collection/**"
      - "foundations/BELLMAN_ANYTIME_VALID_DATA_TO_DECISION.md"
      - "foundations/BELLMAN_MULTISTREAM_COLLECTION_AND_DECISIONS.md"
  push:
    branches:
      - codex/statistical-decision-bridge
      - codex/multistream-collection

permissions:
  contents: read

jobs:
  exact-checks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Run current multistream, scalar, and pinned preservation checks
        env:
          PYTHONDONTWRITEBYTECODE: "1"
        run: python3 verification/multistream_collection/run_checks.py
