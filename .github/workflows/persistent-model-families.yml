name: Persistent model-family checks
on:
  pull_request:
    paths:
      - 'verification/persistent_model_families/**'
      - 'foundations/BELLMAN_PERSISTENT_MODEL_FAMILY_CERTIFICATES.md'
      - '.github/workflows/persistent-model-families.yml'
permissions:
  contents: read
jobs:
  exact-checks:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          fetch-depth: 0
          persist-credentials: false
      - name: Exact family and preservation checks
        env:
          PYTHONDONTWRITEBYTECODE: '1'
        run: python3 verification/persistent_model_families/run_checks.py
