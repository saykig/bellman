name: Reconstruct KL5 Stage R archive

on:
  push:
    branches:
      - archive/kl5-stage-r-stop
    paths:
      - .github/workflows/reconstruct-kl5-stage-r.yml

permissions:
  contents: write

jobs:
  reconstruct:
    runs-on: ubuntu-latest
    steps:
      - name: Check out archive branch
        uses: actions/checkout@v4
        with:
          ref: archive/kl5-stage-r-stop
          fetch-depth: 0

      - name: Reconstruct and verify Stage R report
        shell: bash
        run: |
          set -euo pipefail

          mkdir -p experiments/kl5

          cat .archive-payload-kl5r/part00 \
              .archive-payload-kl5r/part01 \
              .archive-payload-kl5r/part02 \
            | base64 --decode \
            | gzip --decompress --stdout \
            > experiments/kl5/kahneman_lab_5R_replication_gate.md

          printf '%s  %s\n' \
            '4cd74eef7b2dc6cf8340876aaaba4cdbd90f3010df710d61b0f21440e8effe94' \
            'experiments/kl5/kahneman_lab_5R_replication_gate.md' \
            | sha256sum --check

          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add experiments/kl5/kahneman_lab_5R_replication_gate.md
          git rm -r .archive-payload-kl5r .github/workflows/reconstruct-kl5-stage-r.yml
          git commit -m 'archive: add frozen KL5 Stage R report'
          git push origin HEAD:archive/kl5-stage-r-stop
